name: Build QYS Mace Hitter

on:
  push:
    branches:
      - standalone-26.3
  pull_request:
    branches:
      - standalone-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: QYS-Mace-Hitter-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
